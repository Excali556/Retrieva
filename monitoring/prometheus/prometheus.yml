global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'chatbot-api'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['chatbot-api:8000']
        labels:
          service: 'rag-api'
          environment: 'production'

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
