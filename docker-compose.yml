version: '3.8'

services:
  # 1. FastAPI RAG Backend
  chatbot-api:
    build: .
    container_name: chatbot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RETRIEVER_TYPE=hybrid
      - HYBRID_ALPHA=0.3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/code/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Streamlit Interactive UI
  frontend:
    image: python:3.11-slim
    container_name: chatbot-ui
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://chatbot-api:8000
      - GRAFANA_URL=http://localhost:3000
      - PROMETHEUS_URL=http://localhost:9090
    command: >
      sh -c "pip install --no-cache-dir streamlit requests streamlit-lottie && 
             streamlit run app.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      chatbot-api:
        condition: service_started

  # 3. Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: rag-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - chatbot-api

  # 4. Grafana Observability Dashboard
  grafana:
    image: grafana/grafana:10.4.0
    container_name: rag-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/rag_mlops_dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # 5. Redis Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
