name: Retrieva MLOps Pipeline & CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Unit & Integration Tests
        run: |
          python -m pytest tests/ -v

      - name: Run Data Validation Pipeline
        run: |
          python scripts/ingest.py
          python mlops/data_validation.py

      - name: Run MLOps RAG Evaluation Benchmark (Quality Gate)
        run: |
          python mlops/eval/evaluate.py

      - name: Build Docker Container
        run: |
          docker build -t retrieva-api:latest .
